<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мои расходы</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f4ef;
  --card: #ffffff;
  --card2: #f0ece4;
  --accent: #b85c2a;
  --accent2: #d4956a;
  --text: #2a2018;
  --sub: #8a7a6a;
  --border: #e0d8cc;
  --good: #4a8c5c;
  --warn: #c9902e;
  --bad: #c94040;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { min-height:100vh; background:var(--bg); font-family:'Nunito',sans-serif; color:var(--text); padding:0 0 60px; }
.header { background:var(--card); padding:18px 18px 14px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; box-shadow:0 2px 8px rgba(0,0,0,0.04); }
.header-title { font-family:'Cormorant Garamond',serif; font-size:22px; color:var(--accent); font-style:italic; }
.header-date { font-size:11px; color:var(--sub); margin-top:2px; }
.header-btns { display:flex; gap:8px; flex-shrink:0; }
.settings-btn { background:var(--card2); border:1px solid var(--border); border-radius:10px; padding:8px 10px; cursor:pointer; font-size:16px; }
.sync-bar { background:var(--card2); border-bottom:1px solid var(--border); padding:7px 18px; font-size:11px; color:var(--sub); display:flex; align-items:center; gap:6px; }
.sync-dot { width:7px; height:7px; border-radius:50%; background:var(--sub); flex-shrink:0; transition:background 0.3s; }
.sync-dot.ok { background:var(--good); }
.sync-dot.err { background:var(--bad); }
.sync-dot.loading { background:var(--warn); animation:pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.limits-panel { padding:14px 18px; display:flex; gap:10px; }
.avg-card { background:#f4f1ea; }
.limit-card { flex:1; background:var(--card); border-radius:14px; padding:12px 14px; border:1px solid var(--border); }
.limit-label { font-size:10px; font-weight:800; letter-spacing:1.5px; color:var(--sub); text-transform:uppercase; margin-bottom:4px; }
.limit-amount { font-family:'Cormorant Garamond',serif; font-size:20px; color:var(--text); font-weight:600; }
.limit-amount.over { color:var(--bad); }
.limit-sub { font-size:11px; color:var(--sub); margin-top:2px; }
.limit-bar { height:4px; background:var(--border); border-radius:99px; margin-top:8px; overflow:hidden; }
.limit-fill { height:100%; border-radius:99px; transition:width 0.5s ease; }
.add-section { padding:0 18px 14px; }
.add-label { font-size:10px; font-weight:800; letter-spacing:1.5px; color:var(--sub); text-transform:uppercase; margin-bottom:8px; }
.input-wrap { position:relative; }
.expense-input { width:100%; padding:11px 14px; background:var(--card); border:1.5px solid var(--border); border-radius:12px; color:var(--text); font-family:'Nunito',sans-serif; font-size:14px; outline:none; transition:border-color 0.2s; }
.expense-input:focus { border-color:var(--accent); }
.expense-input::placeholder { color:var(--sub); }
.autocomplete-drop { display:none; position:absolute; top:calc(100% + 4px); left:0; right:0; background:var(--card); border:1px solid var(--border); border-radius:12px; z-index:50; overflow:hidden; box-shadow:0 8px 24px rgba(0,0,0,0.12); }
.autocomplete-item { padding:10px 14px; font-size:13px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); }
.autocomplete-item:last-child { border-bottom:none; }
.autocomplete-item:active { background:var(--card2); }
.autocomplete-cat { font-size:11px; color:var(--sub); }
.cat-badge { display:none; padding:5px 12px; background:var(--card2); border:1px solid var(--border); border-radius:20px; font-size:12px; color:var(--accent); font-weight:700; margin-top:7px; }
.cat-badge.show { display:inline-block; }
.amount-row { display:flex; gap:8px; margin-top:8px; }
.amount-input { flex:1; padding:11px 14px; background:var(--card); border:1.5px solid var(--border); border-radius:12px; color:var(--text); font-family:'Nunito',sans-serif; font-size:14px; outline:none; transition:border-color 0.2s; }
.amount-input:focus { border-color:var(--accent); }
.amount-input::placeholder { color:var(--sub); }
.amount-preview { font-size:11px; color:var(--sub); margin-top:4px; min-height:16px; }
.add-btn { width:100%; margin-top:10px; padding:13px; border-radius:12px; background:linear-gradient(135deg,var(--accent),var(--accent2)); border:none; color:#fff; font-family:'Nunito',sans-serif; font-size:15px; font-weight:800; cursor:pointer; transition:opacity 0.2s; }
.add-btn:active { opacity:0.8; }
.add-btn:disabled { opacity:0.35; cursor:default; }
.section-wrap { padding:0 18px 8px; }
.section-toggle { display:flex; align-items:center; gap:8px; cursor:pointer; padding:10px 0; }
.section-title { font-size:11px; font-weight:800; letter-spacing:1.5px; color:var(--sub); text-transform:uppercase; white-space:nowrap; }
.section-arrow { font-size:10px; color:var(--sub); transition:transform 0.2s; }
.section-arrow.open { transform:rotate(180deg); }
.section-line { flex:1; height:1px; background:var(--border); }
.section-body { display:none; }
.section-body.open { display:block; }
.history-item { display:flex; align-items:center; gap:8px; padding:10px 14px; background:var(--card); border-radius:12px; margin-bottom:6px; border:1px solid var(--border); }
.history-left { flex:1; }
.history-name { font-size:14px; font-weight:600; }
.history-meta { font-size:11px; color:var(--sub); margin-top:2px; }
.history-amount { font-size:14px; font-weight:700; color:var(--accent); white-space:nowrap; }
.history-del { background:none; border:none; color:#ccc; font-size:18px; cursor:pointer; padding:4px; flex-shrink:0; line-height:1; }
.cat-row { cursor:pointer; }
.cat-empty { opacity:.45; }
.cat-avg { font-size:10px; color:var(--sub); margin-top:2px; font-weight:400; }
.cat-row:active { background:var(--card2); }
.cat-arrow { font-size:10px; color:var(--sub); margin-left:6px; }
.cat-details { display:none; margin:-2px 0 6px; padding:2px 14px 6px; }
.cat-details.open { display:block; }
.cat-item { display:flex; align-items:center; gap:10px; padding:5px 0; font-size:12px; border-bottom:1px solid var(--border); }
.cat-item:last-child { border-bottom:none; }
.cat-item-date { color:var(--sub); flex:0 0 44px; }
.cat-item-name { flex:1; }
.cat-item-sum { color:var(--accent); white-space:nowrap; }
.report-row { display:flex; justify-content:space-between; align-items:center; padding:9px 14px; background:var(--card); border-radius:10px; margin-bottom:5px; border:1px solid var(--border); }
.report-name { font-size:13px; font-weight:600; }
.report-right { text-align:right; }
.report-amount { font-size:13px; font-weight:700; color:var(--accent); }
.report-usd { font-size:11px; color:var(--sub); }
.report-total { display:flex; justify-content:space-between; align-items:center; padding:10px 14px; background:var(--card2); border-radius:10px; margin-top:4px; border:1.5px solid var(--border); }
.report-total-label { font-size:12px; font-weight:800; }
.report-total-amount { font-size:14px; font-weight:900; color:var(--accent); }
.month-tab-wrap { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
.month-tab { padding:5px 12px; border-radius:20px; border:1.5px solid var(--border); background:var(--card); font-size:12px; font-weight:700; cursor:pointer; color:var(--sub); }
.month-tab.active { border-color:var(--accent); color:var(--accent); background:var(--card2); }
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:100; align-items:center; justify-content:center; padding:20px; }
.modal-overlay.open { display:flex; }
.modal { background:var(--card); border-radius:20px; padding:24px; width:100%; max-width:360px; border:1px solid var(--border); max-height:80vh; overflow-y:auto; }
.modal-title { font-family:'Cormorant Garamond',serif; font-size:20px; color:var(--accent); margin-bottom:18px; }
.modal-field { margin-bottom:14px; }
.modal-label { font-size:11px; font-weight:700; letter-spacing:1px; color:var(--sub); text-transform:uppercase; margin-bottom:6px; display:block; }
.modal-input { width:100%; padding:10px 14px; background:var(--card2); border:1.5px solid var(--border); border-radius:10px; color:var(--text); font-family:'Nunito',sans-serif; font-size:14px; outline:none; }
.modal-input:focus { border-color:var(--accent); }
.modal-btn { width:100%; padding:12px; background:linear-gradient(135deg,var(--accent),var(--accent2)); border:none; border-radius:10px; color:#fff; font-family:'Nunito',sans-serif; font-size:14px; font-weight:800; cursor:pointer; margin-top:6px; }
.modal-close { width:100%; padding:10px; background:none; border:1px solid var(--border); border-radius:10px; color:var(--sub); font-family:'Nunito',sans-serif; font-size:13px; cursor:pointer; margin-top:8px; }
.confirm-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:200; align-items:flex-end; justify-content:center; padding:20px; }
.confirm-overlay.open { display:flex; }
.confirm-box { background:var(--card); border-radius:16px; padding:20px; width:100%; max-width:360px; }
.confirm-title { font-size:15px; font-weight:700; margin-bottom:6px; }
.confirm-sub { font-size:13px; color:var(--sub); margin-bottom:16px; }
.confirm-btns { display:flex; gap:8px; }
.confirm-yes { flex:1; padding:11px; background:var(--bad); border:none; border-radius:10px; color:#fff; font-family:'Nunito',sans-serif; font-size:14px; font-weight:800; cursor:pointer; }
.confirm-no { flex:1; padding:11px; background:var(--card2); border:1px solid var(--border); border-radius:10px; color:var(--sub); font-family:'Nunito',sans-serif; font-size:13px; font-weight:700; cursor:pointer; }
.empty { text-align:center; padding:20px; color:var(--sub); font-size:13px; }
.guide-cat { margin-bottom:12px; }
.guide-cat-title { font-size:13px; font-weight:700; margin-bottom:4px; }
.guide-cat-words { font-size:12px; color:var(--sub); line-height:1.6; }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">Мои расходы</div>
    <div class="header-date" id="headerDate"></div>
  </div>
  <div class="header-btns">
    <button class="settings-btn" onclick="openGuide()">📖</button>
    <button class="settings-btn" onclick="openSettings()">⚙️</button>
  </div>
</div>
<div class="sync-bar">
  <div class="sync-dot" id="syncDot"></div>
  <span id="syncStatus">Загрузка...</span>
</div>

<div class="limits-panel">
  <div class="limit-card">
    <div class="limit-label">Эта неделя</div>
    <div class="limit-amount" id="weekAmount">0 ₫</div>
    <div class="limit-sub">лимит <span id="weekLimitDisplay">1 500 000</span> ₫</div>
    <div class="limit-bar"><div class="limit-fill" id="weekBar" style="width:0%;background:var(--good)"></div></div>
  </div>
  <div class="limit-card">
    <div class="limit-label">Этот месяц</div>
    <div class="limit-amount" id="monthAmount">0 ₫</div>
    <div class="limit-sub">лимит <span id="monthLimitDisplay">15 000 000</span> ₫</div>
    <div class="limit-bar"><div class="limit-fill" id="monthBar" style="width:0%;background:var(--good)"></div></div>
  </div>
  <div class="limit-card avg-card">
    <div class="limit-label">Средний месяц</div>
    <div class="limit-amount" id="avgAmount">0 ₫</div>
    <div class="limit-sub" id="avgSub">—</div>
    <div class="limit-bar"><div class="limit-fill" id="avgBar" style="width:0%;background:var(--sub)"></div></div>
  </div>
</div>

<div class="add-section">
  <div class="add-label">➕ Новый расход</div>
  <div class="input-wrap">
    <input class="expense-input" id="nameInput" type="text" placeholder="Название (такси, мясо, лечение...)" autocomplete="off" oninput="onNameInput(this.value)" onkeydown="onKeyDown(event)">
    <div class="autocomplete-drop" id="autoDrop"></div>
  </div>
  <div class="cat-badge" id="catBadge"></div>
  <div class="amount-row">
    <input class="amount-input" id="amountInput" type="number" inputmode="numeric" placeholder="Сумма (тысяч ₫)" oninput="onAmountInput(this.value)" onkeydown="onKeyDown(event)">
  </div>
  <div class="amount-preview" id="amountPreview"></div>
  <button class="add-btn" id="addBtn" onclick="addExpense()" disabled>Добавить — Enter</button>
</div>

<div class="section-wrap">
  <div class="section-toggle" onclick="toggleSection('history')">
    <span class="section-title">📋 История</span>
    <span class="section-arrow open" id="history-arrow">▼</span>
    <div class="section-line"></div>
  </div>
  <div class="section-body open" id="history-body">
    <div class="month-tab-wrap" id="histMonthTabs"></div>
    <div id="historyList"><div class="empty">Загрузка...</div></div>
  </div>
</div>

<div class="section-wrap">
  <div class="section-toggle" onclick="toggleSection('monthly')">
    <span class="section-title">📊 Отчёт по категориям</span>
    <span class="section-arrow open" id="monthly-arrow">▼</span>
    <div class="section-line"></div>
  </div>
  <div class="section-body open" id="monthly-body">
    <div class="month-tab-wrap" id="monthTabs"></div>
    <div id="monthlyReport"></div>
  </div>
</div>

<div class="section-wrap">
  <div class="section-toggle" onclick="toggleSection('products')">
    <span class="section-title">🛒 Продукты по месяцам</span>
    <span class="section-arrow open" id="products-arrow">▼</span>
    <div class="section-line"></div>
  </div>
  <div class="section-body open" id="products-body">
    <div class="month-tab-wrap" id="productMonthTabs"></div>
    <div id="productsReport"></div>
  </div>
</div>

<div class="modal-overlay" id="guideModal">
  <div class="modal">
    <div class="modal-title">📖 Справочник категорий</div>
    <div id="guideContent"></div>
    <button class="modal-close" onclick="closeGuide()">Закрыть</button>
  </div>
</div>

<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <div class="modal-title">⚙️ Настройки</div>
    <div class="modal-field">
      <label class="modal-label">Недельный лимит (₫)</label>
      <input class="modal-input" id="setWeekLimit" type="number">
    </div>
    <div class="modal-field">
      <label class="modal-label">Месячный лимит (₫)</label>
      <input class="modal-input" id="setMonthLimit" type="number">
    </div>
    <div style="font-size:12px;color:var(--sub);margin-bottom:14px;" id="rateInfo">Курс: загрузка...</div>
    <button class="modal-btn" onclick="saveSettings()">Сохранить</button>
    <button class="modal-close" onclick="closeSettings()">Отмена</button>
  </div>
</div>

<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <div class="confirm-title">Удалить запись?</div>
    <div class="confirm-sub" id="confirmText"></div>
    <div class="confirm-btns">
      <button class="confirm-no" onclick="closeConfirm()">Отмена</button>
      <button class="confirm-yes" onclick="confirmDelete()">Удалить</button>
    </div>
  </div>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyF9bGYgRI4JnycPvcQiYH6R-zOd5gzvpRYi2K-ZppaD1H-5XCg0VFdStHuZQBsvnFc0g/exec';

const CATEGORIES = {
  "Продукты":       {emoji:"🛒", monthly:false},
  "Транспорт":      {emoji:"🚗", monthly:false},
  "Домашние":       {emoji:"🏠", monthly:false},
  "Медицина":       {emoji:"💊", monthly:false},
  "Развлечения":    {emoji:"🎉", monthly:false},
  "Ежемесячно":     {emoji:"📅", monthly:true},
  "Бьюти":          {emoji:"💅", monthly:false},
  "Гардероб":       {emoji:"👗", monthly:false},
  "Путешествия":    {emoji:"✈️", monthly:false},
};

const DICTIONARY = {
  "бакалея":"Продукты","курица":"Продукты","масло":"Продукты",
  "молочка":"Продукты","морепродукты":"Продукты","мясо":"Продукты",
  "напитки":"Продукты","овощи":"Продукты","орехи":"Продукты",
  "рыба":"Продукты","сладости":"Продукты",
  "сыр":"Продукты","фрукты":"Продукты","яйца":"Продукты",
  
  "автобус":"Транспорт","такси":"Транспорт",
  "хозяйственные":"Домашние","ремонт":"Домашние","техника":"Домашние","цветы":"Домашние",
  "физио":"Медицина","лекарства":"Медицина","бады":"Медицина","лечение":"Медицина","анализы":"Медицина",
  "ресторан":"Развлечения","кафе":"Развлечения","подарки":"Развлечения","алкоголь":"Развлечения",
  "обед":"Ежемесячно","связь":"Ежемесячно","жилье":"Ежемесячно","клининг":"Ежемесячно","подписки":"Ежемесячно","виза":"Ежемесячно",
  "массаж":"Бьюти","косметика":"Бьюти",
  "одежда":"Гардероб","обувь":"Гардероб","аксессуары":"Гардероб",
  "путешествие":"Путешествия",
};

let expenses = [];
let weekLimit = parseInt(localStorage.getItem('weekLimit')||'1500000');
let monthLimit = parseInt(localStorage.getItem('monthLimit')||'15000000');
let usdRate = 25000;
let currentCat = null;
let deleteId = null;
let selectedMonth = null;
let selectedProductMonth = null;

function setSyncStatus(state, msg) {
  const dot = document.getElementById('syncDot');
  const txt = document.getElementById('syncStatus');
  dot.className = 'sync-dot ' + state;
  txt.textContent = msg;
}

async function loadExpenses() {
  setSyncStatus('loading','Загрузка...');
  try {
    const r = await fetch(GAS_URL + '?t=' + Date.now());
    const data = await r.json();
    expenses = data
      .filter(r => r.id)
      .map(r => ({
        id: Number(r.id),
        date: r.date,
        name: r.name,
        category: r.category,
        amount: Number(r.amount),
        usdAmount: Number(r.usdAmount),
        usdRate: Number(r.usdRate),
      }))
      .sort((a,b) => b.id - a.id);
    setSyncStatus('ok','Синхронизировано');
  } catch {
    setSyncStatus('err','Нет соединения');
  }
}

async function saveExpense(expense) {
  setSyncStatus('loading','Сохранение...');
  try {
    await fetch(GAS_URL, {
      method:'POST', mode:'no-cors',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action:'add', ...expense})
    });
    setSyncStatus('ok','Сохранено');
  } catch {
    setSyncStatus('err','Ошибка сохранения');
  }
}

async function deleteExpenseRemote(id) {
  setSyncStatus('loading','Удаление...');
  try {
    await fetch(GAS_URL, {
      method:'POST', mode:'no-cors',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action:'delete', id})
    });
    setSyncStatus('ok','Удалено');
  } catch {
    setSyncStatus('err','Ошибка удаления');
  }
}

async function loadRate() {
  try {
    const r = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
    const d = await r.json();
    if (d.rates && d.rates.VND) {
      usdRate = Math.round(d.rates.VND);
      document.getElementById('rateInfo').textContent = `Курс: 1 USD = ${usdRate.toLocaleString()} ₫`;
    }
  } catch {
    document.getElementById('rateInfo').textContent = `Курс офлайн: 1 USD = ${usdRate.toLocaleString()} ₫`;
  }
}

async function init() {
  updateHeaderDate();
  await Promise.all([loadExpenses(), loadRate()]);
  renderAll();
  setInterval(async () => {
    await loadExpenses();
    renderAll();
  }, 30000);
}

function updateHeaderDate() {
  const d = new Date();
  const days = ['вс','пн','вт','ср','чт','пт','сб'];
  const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  document.getElementById('headerDate').textContent =
    `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

function openGuide() {
  const content = document.getElementById('guideContent');
  const catWords = {};
  Object.keys(DICTIONARY).forEach(word => {
    const cat = DICTIONARY[word];
    if (!catWords[cat]) catWords[cat] = [];
    catWords[cat].push(word);
  });
  content.innerHTML = Object.keys(CATEGORIES).map(cat => {
    const words = catWords[cat] || [];
    if (!words.length) return '';
    return `<div class="guide-cat">
      <div class="guide-cat-title">${CATEGORIES[cat].emoji} ${cat}</div>
      <div class="guide-cat-words">${words.join(', ')}</div>
    </div>`;
  }).join('');
  document.getElementById('guideModal').classList.add('open');
}
function closeGuide() {
  document.getElementById('guideModal').classList.remove('open');
}

// Названия приводим к одному виду: строчные и «ё» → «е».
// Иначе «Жильё» и «жилье» считаются разными строками в отчёте.
function normName(s){ return String(s||'').toLowerCase().replace(/ё/g,'е').trim(); }

function onNameInput(val) {
  const q = val.toLowerCase().trim();
  const drop = document.getElementById('autoDrop');
  const badge = document.getElementById('catBadge');
  const exactCat = DICTIONARY[q];
  if (exactCat) {
    currentCat = exactCat;
    badge.textContent = CATEGORIES[exactCat].emoji + ' ' + exactCat;
    badge.classList.add('show');
  } else {
    currentCat = null;
    badge.classList.remove('show');
  }
  checkAddBtn();
  if (!q) { drop.style.display='none'; return; }
  const matches = Object.keys(DICTIONARY).filter(k => k.startsWith(q) && k !== q);
  if (!matches.length) { drop.style.display='none'; return; }
  drop.innerHTML = matches.slice(0,6).map(k =>
    `<div class="autocomplete-item" onclick="selectName('${k.replace(/'/g,"\\'")}')">
      <span>${k}</span>
      <span class="autocomplete-cat">${CATEGORIES[DICTIONARY[k]].emoji} ${DICTIONARY[k]}</span>
    </div>`
  ).join('');
  drop.style.display = 'block';
}

function selectName(name) {
  document.getElementById('nameInput').value = name;
  document.getElementById('autoDrop').style.display = 'none';
  onNameInput(name);
  document.getElementById('amountInput').focus();
}

function onAmountInput(val) {
  const preview = document.getElementById('amountPreview');
  if (val && !isNaN(val) && val > 0) {
    preview.textContent = `= ${(val*1000).toLocaleString()} ₫`;
  } else preview.textContent = '';
  checkAddBtn();
}

function onKeyDown(e) {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  const drop = document.getElementById('autoDrop');
  if (drop.style.display === 'block') {
    const first = drop.querySelector('.autocomplete-item');
    if (first) { first.click(); return; }
  }
  if (!document.getElementById('addBtn').disabled) addExpense();
  else document.getElementById('amountInput').focus();
}

function checkAddBtn() {
  const name = document.getElementById('nameInput').value.trim();
  const amount = document.getElementById('amountInput').value;
  document.getElementById('addBtn').disabled = !(name && amount && amount > 0 && currentCat);
}

async function addExpense() {
  const name   = normName(document.getElementById('nameInput').value);
  const amount = parseFloat(document.getElementById('amountInput').value) * 1000;
  if (!name || !amount || !currentCat) return;

  const expense = {
    id: Date.now(),
    name, amount,
    category: currentCat,
    usdRate,
    usdAmount: parseFloat((amount/usdRate).toFixed(2)),
    date: new Date().toISOString(),
  };

  expenses.unshift(expense);
  document.getElementById('nameInput').value = '';
  document.getElementById('amountInput').value = '';
  document.getElementById('amountPreview').textContent = '';
  document.getElementById('catBadge').classList.remove('show');
  document.getElementById('autoDrop').style.display = 'none';
  currentCat = null;
  checkAddBtn();
  renderAll();
  await saveExpense(expense);
}

function askDelete(id) {
  const e = expenses.find(x => x.id === id);
  if (!e) return;
  deleteId = id;
  document.getElementById('confirmText').textContent = `«${e.name}» — ${e.amount.toLocaleString()} ₫`;
  document.getElementById('confirmOverlay').classList.add('open');
}
function closeConfirm() {
  deleteId = null;
  document.getElementById('confirmOverlay').classList.remove('open');
}
async function confirmDelete() {
  if (!deleteId) return;
  const id = deleteId;
  expenses = expenses.filter(e => e.id !== id);
  closeConfirm();
  renderAll();
  await deleteExpenseRemote(id);
}

function renderAll() {
  renderLimits();
  renderHistMonthTabs();
  renderHistory();
  renderMonthTabs();
  renderProductMonthTabs();
  document.getElementById('weekLimitDisplay').textContent = weekLimit.toLocaleString();
  document.getElementById('monthLimitDisplay').textContent = monthLimit.toLocaleString();
  document.getElementById('setWeekLimit').value = weekLimit;
  document.getElementById('setMonthLimit').value = monthLimit;
}

function getWeekStart() {
  const d = new Date(), day = d.getDay();
  const mon = new Date(d);
  mon.setDate(d.getDate() + (day===0?-6:1-day));
  mon.setHours(0,0,0,0);
  return mon;
}

function renderLimits() {
  const weekStart = getWeekStart();
  const monthStart = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  let wt=0, mt=0;
  expenses.forEach(e => {
    const d = new Date(e.date);
    if (d >= weekStart && !CATEGORIES[e.category]?.monthly) wt += e.amount;
    if (d >= monthStart) mt += e.amount;
  });
  const setBar = (amtId, barId, total, limit) => {
    const pct = Math.min((total/limit)*100,100);
    const col = total>limit?'var(--bad)':total>limit*0.8?'var(--warn)':'var(--good)';
    document.getElementById(amtId).textContent = total.toLocaleString()+' ₫';
    document.getElementById(amtId).className = 'limit-amount'+(total>limit?' over':'');
    document.getElementById(barId).style.cssText = `width:${pct}%;background:${col}`;
  };
  setBar('weekAmount','weekBar',wt,weekLimit);
  setBar('monthAmount','monthBar',mt,monthLimit);

  // Средний месяц без путешествий: поездки разовые и в отдельные месяцы
  // съедают до 95 % трат, из-за чего среднее переставало отражать быт.
  const мес = getMonthsList();
  const бытСумма = expenses.filter(e=>e.category!=='Путешествия')
                           .reduce((s,e)=>s+Number(e.amount),0);
  const поездкиСумма = expenses.filter(e=>e.category==='Путешествия')
                               .reduce((s,e)=>s+Number(e.amount),0);
  const среднее = мес.length ? Math.round(бытСумма/мес.length) : 0;
  const срПоездки = мес.length ? Math.round(поездкиСумма/мес.length) : 0;
  const бытМесяц = expenses.filter(e=>{
    const d=new Date(e.date);
    return e.category!=='Путешествия' && d>=monthStart;
  }).reduce((s,e)=>s+Number(e.amount),0);

  document.getElementById('avgAmount').textContent = среднее.toLocaleString()+' ₫';
  document.getElementById('avgSub').innerHTML =
    мес.length ? 'без поездок · $'+Math.round(среднее/usdRate)+
      '<br><span style="opacity:.7">поездки ещё '+срПоездки.toLocaleString('ru-RU')+' ₫</span>' : '—';
  // полоска: текущий месяц без поездок против обычного
  const доля = среднее ? Math.min(бытМесяц/среднее*100,100) : 0;
  document.getElementById('avgBar').style.cssText =
    `width:${доля}%;background:${бытМесяц>среднее?'var(--warn)':'var(--sub)'}`;
}

function formatDt(iso) {
  const d = new Date(iso);
  const days=['вс','пн','вт','ср','чт','пт','сб'];
  return `${days[d.getDay()]} ${d.getDate()}.${String(d.getMonth()+1).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

// История по месяцам: раньше показывалась только текущая неделя
let histMonth = null;
function selectHistMonth(m){ histMonth = m; renderHistMonthTabs(); renderHistory(); }
function renderHistMonthTabs(){
  const el = document.getElementById('histMonthTabs'); if(!el) return;
  const months = getMonthsList();
  if (!histMonth || !months.includes(histMonth)) histMonth = months[0];
  el.innerHTML = months.map(m =>
    `<div class="month-tab${m===histMonth?' active':''}" onclick="selectHistMonth('${m}')">${MONTH_NAMES[parseInt(m.split('-')[1])-1]} ${m.split('-')[0]}</div>`
  ).join('');
}
function renderHistory() {
  const el = document.getElementById('historyList');
  const months = getMonthsList();
  if (!histMonth || !months.includes(histMonth)) histMonth = months[0];
  const [y,mo] = histMonth.split('-');
  const start = new Date(+y,+mo-1,1), end = new Date(+y,+mo,1);
  const list = expenses.filter(e => { const d=new Date(e.date); return d>=start && d<end; });
  if (!list.length) { el.innerHTML='<div class="empty">В этом месяце расходов нет</div>'; return; }
  el.innerHTML = list.map(e =>
    `<div class="history-item">
      <div class="history-left">
        <div class="history-name">${CATEGORIES[e.category]?.emoji||''} ${e.name}</div>
        <div class="history-meta">${e.category} · ${formatDt(e.date)}</div>
      </div>
      <div class="history-amount">${e.amount.toLocaleString()} ₫</div>
      <button class="history-del" onclick="askDelete(${e.id})">×</button>
    </div>`
  ).join('');
}

const MONTH_NAMES=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];

function getMonthsList() {
  const m={};
  expenses.forEach(e=>{
    const d=new Date(e.date);
    m[`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`]=true;
  });
  return Object.keys(m).sort().reverse();
}

function renderMonthTabs() {
  const months = getMonthsList();
  if (!months.length) { document.getElementById('monthTabs').innerHTML=''; document.getElementById('monthlyReport').innerHTML='<div class="empty">Нет данных</div>'; return; }
  if (!selectedMonth||!months.includes(selectedMonth)) selectedMonth=months[0];
  document.getElementById('monthTabs').innerHTML=months.map(m=>{
    const [y,mo]=m.split('-');
    return `<div class="month-tab${m===selectedMonth?' active':''}" onclick="selectMonth('${m}')">${MONTH_NAMES[parseInt(mo)-1]} ${y}</div>`;
  }).join('');
  renderMonthlyReport();
}

function selectMonth(m) { selectedMonth=m; renderMonthTabs(); }

// Нажатие на рубрику показывает, из чего она сложилась
function catId(cat){ return cat.replace(/[^a-zA-Zа-яА-Я0-9]/g,'_'); }
function toggleCat(cat){
  const box=document.getElementById('cd-'+catId(cat));
  const arr=document.getElementById('ca-'+catId(cat));
  if(!box) return;
  if(box.classList.contains('open')){ box.classList.remove('open'); box.innerHTML=''; if(arr) arr.textContent='▾'; return; }
  const [y,mo]=selectedMonth.split('-');
  const start=new Date(+y,+mo-1,1), end=new Date(+y,+mo,1);
  const список=expenses
    .filter(e=>e.category===cat && new Date(e.date)>=start && new Date(e.date)<end)
    .sort((a,b)=>new Date(a.date)-new Date(b.date));
  box.innerHTML=список.map(e=>
    `<div class="cat-item">
      <span class="cat-item-date">${new Date(e.date).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'})}</span>
      <span class="cat-item-name">${e.name}</span>
      <span class="cat-item-sum">${Number(e.amount).toLocaleString('ru-RU')} ₫</span>
    </div>`).join('');
  box.classList.add('open');
  if(arr) arr.textContent='▴';
}

function renderMonthlyReport() {
  const [y,mo]=selectedMonth.split('-');
  const start=new Date(+y,+mo-1,1), end=new Date(+y,+mo,1);
  const totals={}, usdTotals={};
  let gt=0, gu=0;
  expenses.forEach(e=>{
    const d=new Date(e.date);
    if(d>=start&&d<end){
      totals[e.category]=(totals[e.category]||0)+e.amount;
      usdTotals[e.category]=(usdTotals[e.category]||0)+(e.usdAmount||e.amount/usdRate);
      gt+=e.amount; gu+=(e.usdAmount||e.amount/usdRate);
    }
  });
  // Порядок рубрик всегда один — как они объявлены, а не по сумме.
  // Иначе строки скачут от месяца к месяцу и их приходится искать.
  const порядок=Object.keys(CATEGORIES);
  // Показываем все рубрики, даже пустые — иначе строки скачут
  // и месяцы не сравнить.
  const прочие=Object.keys(totals).filter(k=>!порядок.includes(k));
  const sorted=[...порядок,...прочие].map(k=>[k,totals[k]||0]);
  // среднее по каждой рубрике за все месяцы — опора для сравнения
  const мес=getMonthsList();
  const срПоРубрике={};
  expenses.forEach(e=>{ срПоРубрике[e.category]=(срПоРубрике[e.category]||0)+Number(e.amount); });
  Object.keys(срПоРубрике).forEach(k=>{ срПоРубрике[k]=Math.round(срПоРубрике[k]/(мес.length||1)); });
  if(!sorted.length){document.getElementById('monthlyReport').innerHTML='<div class="empty">Нет данных</div>';return;}

  const allMonths=getMonthsList();
  let avgTotal=0;
  allMonths.forEach(m=>{
    const [my,mm]=m.split('-');
    const ms=new Date(+my,+mm-1,1),me=new Date(+my,+mm,1);
    expenses.forEach(e=>{const d=new Date(e.date);if(d>=ms&&d<me)avgTotal+=e.amount;});
  });
  const avg=allMonths.length>0?Math.round(avgTotal/allMonths.length):0;

  document.getElementById('monthlyReport').innerHTML=
  `<div class="report-total" style="margin-bottom:8px;">
    <div class="report-total-label">Итого за месяц</div>
    <div class="report-right">
      <div class="report-total-amount">${gt.toLocaleString()} ₫</div>
      <div class="report-usd">$${gu.toFixed(2)}</div>
    </div>
  </div>`+
  sorted.map(([cat,total])=>
    `<div class="report-row cat-row${total?'':' cat-empty'}" onclick="toggleCat('${cat.replace(/'/g,"\\'")}')">
      <div class="report-name">${CATEGORIES[cat]?.emoji||''} ${cat}<span class="cat-arrow" id="ca-${catId(cat)}">▾</span>
        <div class="cat-avg">в среднем ${(срПоРубрике[cat]||0).toLocaleString('ru-RU')} ₫</div>
      </div>
      <div class="report-right">
        <div class="report-amount">${total.toLocaleString()} ₫</div>
        <div class="report-usd">$${(usdTotals[cat]||0).toFixed(2)}</div>
      </div>
    </div>
    <div class="cat-details" id="cd-${catId(cat)}"></div>`
  ).join('')+
  (allMonths.length>1?`<div class="report-total" style="margin-top:8px;background:#f0f8f0;border-color:#c0dcc0;">
    <div class="report-total-label">Средний месяц (${allMonths.length} мес.)</div>
    <div class="report-right">
      <div class="report-total-amount" style="color:var(--good)">${avg.toLocaleString()} ₫</div>
      <div class="report-usd">$${(avg/usdRate).toFixed(2)}</div>
    </div>
  </div>`:'');
}

function renderProductMonthTabs() {
  const months=getMonthsList();
  if(!months.length){document.getElementById('productMonthTabs').innerHTML='';document.getElementById('productsReport').innerHTML='<div class="empty">Нет данных</div>';return;}
  if(!selectedProductMonth||!months.includes(selectedProductMonth)) selectedProductMonth=months[0];
  document.getElementById('productMonthTabs').innerHTML=months.map(m=>{
    const [y,mo]=m.split('-');
    return `<div class="month-tab${m===selectedProductMonth?' active':''}" onclick="selectProductMonth('${m}')">${MONTH_NAMES[parseInt(mo)-1]} ${y}</div>`;
  }).join('');
  renderProductsReport();
}

function selectProductMonth(m){selectedProductMonth=m;renderProductMonthTabs();}

function renderProductsReport() {
  const [y,mo]=selectedProductMonth.split('-');
  const start=new Date(+y,+mo-1,1),end=new Date(+y,+mo,1);
  const totals={},usdTotals={};
  let gt=0,gu=0;
  expenses.forEach(e=>{
    const d=new Date(e.date);
    if(d>=start&&d<end&&e.category==='Продукты'){
      const имя=normName(e.name);
      totals[имя]=(totals[имя]||0)+e.amount;
      usdTotals[имя]=(usdTotals[имя]||0)+(e.usdAmount||e.amount/usdRate);
      gt+=e.amount;gu+=(e.usdAmount||e.amount/usdRate);
    }
  });
  const sorted=Object.entries(totals).sort((a,b)=>b[1]-a[1]);
  if(!sorted.length){document.getElementById('productsReport').innerHTML='<div class="empty">Нет данных</div>';return;}
  document.getElementById('productsReport').innerHTML=
  `<div class="report-total" style="margin-bottom:8px;">
    <div class="report-total-label">Итого продукты</div>
    <div class="report-right">
      <div class="report-total-amount">${gt.toLocaleString()} ₫</div>
      <div class="report-usd">$${gu.toFixed(2)}</div>
    </div>
  </div>`+
  sorted.map(([name,total])=>
    `<div class="report-row">
      <div class="report-name">🛒 ${name}</div>
      <div class="report-right">
        <div class="report-amount">${total.toLocaleString()} ₫</div>
        <div class="report-usd">$${(usdTotals[name]||0).toFixed(2)}</div>
      </div>
    </div>`
  ).join('');
}

function toggleSection(id){
  const b=document.getElementById(id+'-body'),a=document.getElementById(id+'-arrow');
  const o=b.classList.contains('open');
  b.classList.toggle('open',!o);a.classList.toggle('open',!o);
}

function openSettings(){
  document.getElementById('setWeekLimit').value=weekLimit;
  document.getElementById('setMonthLimit').value=monthLimit;
  document.getElementById('settingsModal').classList.add('open');
}
function closeSettings(){document.getElementById('settingsModal').classList.remove('open');}
function saveSettings(){
  const wl=parseFloat(document.getElementById('setWeekLimit').value);
  const ml=parseFloat(document.getElementById('setMonthLimit').value);
  if(wl>0){weekLimit=wl;localStorage.setItem('weekLimit',wl);}
  if(ml>0){monthLimit=ml;localStorage.setItem('monthLimit',ml);}
  closeSettings();renderAll();
}

document.addEventListener('click',e=>{
  if(!e.target.closest('.input-wrap')) document.getElementById('autoDrop').style.display='none';
});

init();
</script>
