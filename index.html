<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Narada Travels</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,sans-serif;background:#f7f4ef;color:#2a2018;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.wrap{max-width:340px;width:100%;text-align:center}
.brand{font-size:22px;font-weight:600;color:#b85c2a;letter-spacing:.04em;margin-bottom:6px}
.sub{font-size:12px;color:#8a7a6a;letter-spacing:.12em;text-transform:uppercase;margin-bottom:32px}
a{display:block;padding:14px 20px;background:#fff;border:1px solid #e0d8cc;border-radius:12px;color:#2a2018;text-decoration:none;margin-bottom:10px;font-size:15px;font-weight:500;transition:border-color .15s}
a:hover{border-color:#b85c2a;color:#b85c2a}
.emoji{margin-right:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">Narada Travels</div>
  <div class="sub">Инструменты</div>
  <a href="/narada/"><span class="emoji">📋</span>Бронирования и прайс</a>
  <a href="/b/"><span class="emoji">💰</span>Мои расходы</a>
  <a href="/calc/"><span class="emoji">🔄</span>Конвертер валют</a>
</div>
</body>
</html>
